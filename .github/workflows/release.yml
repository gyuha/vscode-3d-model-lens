name: Release

# 태그를 밀면 마켓플레이스에 게시한다. 게시는 되돌릴 수 없으므로 이 워크플로는
# "태그가 붙었으니 올린다"가 아니라 "게이트를 전부 통과했으니 올린다"로 짜여 있다.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: 게이트 통과 후 마켓플레이스 게시
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 태그와 package.json 의 버전이 어긋나면 엉뚱한 버전이 게시되고 되돌릴 수 없다.
      # 다른 무엇보다 먼저 막는다 — 나머지 게이트를 다 돌린 뒤 알아채면 시간만 버린다.
      - name: 태그와 package.json 버전이 같은지 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::태그 v${tag} 와 package.json 의 ${pkg} 가 다르다 — 게시를 중단한다" >&2
            exit 1
          fi
          echo "버전 일치: ${pkg}"

      # CI 와 같은 게이트를 게시 직전에 한 번 더 친다. 중복이 아니라 의도된 것이다 —
      # `v0.3.0` 은 조작 부호가 두 축 모두 반대인 채로 커밋·push 됐고, 게시를 UAT 뒤로
      # 미뤄 둔 덕에 사용자에게 나가지 않았다 (`.forge/retro/260828-screen-relative-rotation.md`).
      # 태그가 CI 를 통과하지 않은 커밋에 붙을 수 있으므로 여기서 다시 확인해야 한다.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

      # 헤드리스 Chromium 은 SwiftShader 로 WebGL2 를 돌린다 (playwright.config.ts 의 launch args).
      # e2e 를 게이트에 넣는 이유: 회전 방향 · 큐브 클릭 같은 실동작 규약은 유닛이 보지 못한다.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: .vsix 패키징
        run: npx vsce package --no-dependencies -o extension.vsix

      # 테스트를 통과한 **바로 그 산출물**을 올린다 — `vsce publish` 에 다시 빌드시키지 않는다.
      - name: 마켓플레이스 게시
        run: npx vsce publish --no-dependencies --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # 실패했을 때도 무엇이 만들어졌는지 볼 수 있어야 한다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix
          path: extension.vsix
          if-no-files-found: warn
